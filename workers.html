<style>
  :root {
    --navy:#0a1628; --navy-mid:#112244;
    --gold:#c9a84c; --gold-light:#e8c97a; --gold-dim:#8a6e30;
    --white:#ffffff; --white-dim:rgba(255,255,255,0.08); --white-soft:rgba(255,255,255,0.6);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--navy);font-family:'Tajawal',sans-serif;color:var(--white);min-height:100vh;padding:28px 16px;
    background-image:radial-gradient(ellipse at 10% 20%,rgba(201,168,76,0.07) 0%,transparent 50%),radial-gradient(ellipse at 90% 80%,rgba(26,48,96,0.8) 0%,transparent 50%);}
  .app-shell { min-height:100vh; display:flex; }
  .main-layout { flex:1; display:flex; flex-direction:column; }
  .page-content { padding:28px 16px; }
  .header{text-align:center;margin-bottom:20px;}
  .header-line{width:120px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:0 auto 16px;}
  .logo-area{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:6px;}
  .company-name-en{font-size:1rem;color:var(--gold-light);letter-spacing:4px;text-transform:uppercase;font-weight:700;}
  .page-title{font-size:0.92rem;color:var(--gold);margin-top:10px;font-weight:500;letter-spacing:1px;}
  .switch-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0 10px;}
  .switch-button{padding:10px 18px;border-radius:999px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.06);color:var(--white);cursor:pointer;font-weight:700;transition:all .2s;}
  .switch-button.active{background:var(--gold);color:var(--navy);border-color:var(--gold);}
  .legend{display:flex;align-items:center;justify-content:center;gap:22px;margin-bottom:20px;flex-wrap:wrap;}
  .legend-item{display:flex;align-items:center;gap:7px;font-size:0.8rem;color:var(--white-soft);}
  .legend-dot{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;}
  .legend-present{background:rgba(100,200,120,0.25);border:1px solid rgba(100,200,120,0.5);}
  .legend-absent{background:rgba(220,80,80,0.25);border:1px solid rgba(220,80,80,0.5);}
  .legend-empty{background:var(--white-dim);border:1px solid rgba(255,255,255,0.1);}
  .table-wrapper{overflow-x:auto;border-radius:14px;border:1px solid rgba(201,168,76,0.22);box-shadow:0 8px 48px rgba(0,0,0,0.5);margin-bottom:16px;}
  table{border-collapse:collapse;background:var(--navy-mid);width:100%;}
  thead th{background:linear-gradient(180deg,#0d1e3d 0%,var(--navy-mid) 100%);color:var(--gold);font-weight:700;font-size:0.7rem;padding:10px 6px;border-bottom:2px solid var(--gold-dim);border-left:1px solid rgba(255,255,255,0.06);white-space:nowrap;text-align:center;letter-spacing:0.4px;position:sticky;top:0;z-index:2;}
  thead th.th-num{width:42px;min-width:42px;background:linear-gradient(180deg,#0a1628,#0e1f3a);}
  thead th.th-name{width:130px;min-width:130px;text-align:right;padding-right:10px;}
  thead th.th-date{width:80px;min-width:80px;}
  thead th.th-notes{width:130px;min-width:130px;}
  .date-label{font-size:0.7rem;font-weight:700;color:var(--gold);display:block;}
  .day-label{font-size:0.62rem;font-weight:400;color:var(--white-soft);display:block;margin-top:2px;}
  tbody tr{transition:background 0.15s;}
  tbody tr:hover td{background:rgba(201,168,76,0.04);}
  tbody tr:nth-child(even) td{background:rgba(255,255,255,0.015);}
  tbody td{border-bottom:1px solid rgba(255,255,255,0.05);border-left:1px solid rgba(255,255,255,0.04);padding:0;text-align:center;vertical-align:top;}
  td.td-num{font-size:0.7rem;color:var(--gold-dim);font-weight:700;width:42px;min-width:42px;background:rgba(10,22,40,0.7)!important;border-left:none;vertical-align:middle;padding:8px 0;}
  td.td-name{text-align:right;padding:4px 8px;width:130px;min-width:130px;background:rgba(17,34,68,0.95)!important;border-left:1px solid rgba(201,168,76,0.15);vertical-align:top;}
  td.td-name textarea{background:transparent;border:none;outline:none;color:var(--white);font-family:'Tajawal',sans-serif;font-size:0.88rem;font-weight:500;width:100%;text-align:right;padding:4px 2px;resize:none;overflow:hidden;line-height:1.4;min-height:30px;}
  td.td-name textarea::-moz-placeholder{color:rgba(255,255,255,0.18);font-size:0.82rem;}
  td.td-name textarea::placeholder{color:rgba(255,255,255,0.18);font-size:0.82rem;}
  td.td-name textarea:focus{border-bottom:1px solid var(--gold-dim);outline:none;}
  td.td-attend{padding:8px 6px;}
  .attend-grp{display:flex;align-items:center;justify-content:center;gap:3px;margin-bottom:5px;}
  .btn-att{width:26px;height:26px;border-radius:5px;border:1px solid rgba(255,255,255,0.11);background:var(--white-dim);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;transition:all 0.15s;flex-shrink:0;color:rgba(255,255,255,0.35);}
  .btn-att:hover{transform:scale(1.12);}
  .btn-att.ok{background:rgba(100,200,120,0.25);border-color:rgba(100,200,120,0.6);color:#6edd8a;box-shadow:0 0 7px rgba(100,200,120,0.2);}
  .btn-att.no{background:rgba(220,80,80,0.25);border-color:rgba(220,80,80,0.6);color:#f07070;box-shadow:0 0 7px rgba(220,80,80,0.2);}
  .day-note{display:block;width:100%;background:rgba(255,255,255,0.04);border:none;outline:none;border-radius:4px;color:rgba(255,255,255,0.85);font-family:'Tajawal',sans-serif;font-size:0.82rem;font-weight:500;text-align:center;padding:6px 8px;resize:none;overflow:hidden;line-height:1.4;min-height:32px;transition:background 0.15s,color 0.15s,outline 0.15s;}
  .day-note::-moz-placeholder{color:rgba(255,255,255,0.3);font-size:0.75rem;}
  .day-note::placeholder{color:rgba(255,255,255,0.3);font-size:0.75rem;}
  .day-note:focus{color:var(--white);background:rgba(201,168,76,0.08);outline:1px solid rgba(201,168,76,0.35);}
  .summary-cell{padding:10px 8px;vertical-align:top;min-width:100px;}
  .summary-pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:34px;padding:6px 10px;border-radius:999px;font-size:0.72rem;font-weight:700;background:rgba(255,255,255,0.08);color:var(--white);border:1px solid rgba(255,255,255,0.08);margin-bottom:8px;}
  .summary-pill.ok{background:rgba(100,200,120,0.18);color:#8ce7a8;border-color:rgba(100,200,120,0.35);}
  .summary-pill.no{background:rgba(220,80,80,0.18);color:#ff9da1;border-color:rgba(220,80,80,0.35);}
  .summary-input{width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:10px;color:rgba(255,255,255,0.9);font-size:0.72rem;padding:7px 9px;text-align:right;outline:none;}
  .summary-input::-moz-placeholder{color:rgba(255,255,255,0.3);}
  .summary-input::placeholder{color:rgba(255,255,255,0.3);}
  .summary-input:focus{border-color:var(--gold);background:rgba(255,255,255,0.08);}
  td.td-notes{padding:0 7px;width:130px;min-width:130px;vertical-align:middle;}
  td.td-notes input{background:transparent;border:none;outline:none;color:rgba(255,255,255,0.9);font-family:'Tajawal',sans-serif;font-size:0.88rem;font-weight:500;width:100%;text-align:right;padding:4px 2px;}
  td.td-notes input::-moz-placeholder{color:rgba(255,255,255,0.12);}
  td.td-notes input::placeholder{color:rgba(255,255,255,0.12);}
  td.td-notes input:focus{border-bottom:1px solid var(--gold-dim);color:var(--white);}
  .footer{margin-top:26px;text-align:center;}
  .save-btn{background:linear-gradient(135deg,var(--gold),var(--gold-dim));color:var(--navy);border:none;padding:11px 32px;border-radius:30px;font-family:'Tajawal',sans-serif;font-size:0.9rem;font-weight:700;cursor:pointer;box-shadow:0 4px 20px rgba(201,168,76,0.3);transition:all 0.2s;}
  .save-btn:hover{transform:translateY(-2px);box-shadow:0 6px 28px rgba(201,168,76,0.45);}
  .sync-msg{font-size:0.78rem;margin-top:8px;min-height:20px;transition:opacity 0.4s;}
  .sync-msg.ok{color:#6edd8a;} .sync-msg.err{color:#f07070;} .sync-msg.loading{color:var(--gold-light);}
  .footer-brand{margin-top:22px;font-size:0.68rem;color:rgba(255,255,255,0.18);letter-spacing:2px;text-transform:uppercase;}
  .summary-section{margin:32px 0 10px;}
  .summary-title{text-align:center;font-size:0.85rem;color:var(--gold);letter-spacing:1px;font-weight:700;margin-bottom:18px;}
  @media (max-width: 900px) { .thead th {font-size:0.65rem;} .switch-button {width:100%;max-width:220px;} }
</style>
