<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />

  <title>تسجيل الدخول - ملاذ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script type="module" crossorigin src="/Dashboard/assets/login-BCvJvt3n.js"></script>
  <link rel="modulepreload" crossorigin href="/Dashboard/assets/toast-DJo7gZdP.js">
  <link rel="modulepreload" crossorigin href="/Dashboard/assets/main-CvJC25iB.js">

</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 relative overflow-hidden">
  <!-- Background Effects -->
  <div class="absolute inset-0 bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">
    <div class="absolute top-0 left-0 w-full h-full bg-gradient-to-br from-primary-500/10 via-transparent to-accent-purple/10"></div>
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-primary-500/5 rounded-full blur-3xl"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-accent-purple/5 rounded-full blur-3xl"></div>
  </div>

  <!-- Login Card -->
  <div class="relative w-full max-w-md">
    <!-- Card Container -->
    <div class="card-padded backdrop-blur-xl bg-slate-900/90 border border-slate-700/50 shadow-2xl">
      <!-- Header -->
      <div class="text-center mb-8">
        <div class="relative mb-6">
          <div class="w-20 h-20 mx-auto bg-gradient-to-br from-primary-500 to-accent-purple rounded-2xl flex items-center justify-center text-white font-bold text-2xl shadow-lg">
            م
          </div>
          <div class="absolute -bottom-2 -right-2 w-6 h-6 bg-accent-emerald rounded-full border-4 border-slate-900 flex items-center justify-center">
            <div class="w-2 h-2 bg-white rounded-full animate-pulse"></div>
          </div>
        </div>
        <h1 class="text-3xl font-bold text-slate-50 mb-2">ملاذ كلينينج</h1>
        <p class="text-slate-400 text-lg">نظام إدارة الطلبات المتطور</p>
      </div>

      <!-- Error Message -->
      <div id="error-message" class="hidden bg-red-500/20 text-red-300 p-4 rounded-xl mb-6 border border-red-500/30">
        <div class="flex items-center gap-3">
          <svg class="w-5 h-5 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <span class="text-sm font-medium">خطأ في تسجيل الدخول</span>
        </div>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="space-y-6">
        <div class="space-y-4">
          <!-- Email Field -->
          <div>
            <label for="email" class="form-label flex items-center gap-2">
              <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"/>
              </svg>
              البريد الإلكتروني
            </label>
            <input type="email" id="email" class="form-input w-full" placeholder="admin@malaz.com" required />
          </div>

          <!-- Password Field -->
          <div>
            <label for="password" class="form-label flex items-center gap-2">
              <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
              </svg>
              كلمة المرور
            </label>
            <input type="password" id="password" class="form-input w-full" placeholder="••••••••" required />
          </div>
        </div>

        <!-- Submit Button -->
        <div class="pt-4">
          <button type="submit" class="btn-primary w-full py-4 text-base font-semibold flex items-center justify-center gap-3">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
            </svg>
            دخول النظام
          </button>
        </div>
      </form>

      <!-- Footer -->
      <div class="mt-8 pt-6 border-t border-slate-700/50">
        <div class="text-center text-slate-400 text-sm">
          <p>© 2024 ملاذ كلينينج - جميع الحقوق محفوظة</p>
          <p class="mt-1">نظام إدارة متقدم للطلبات والعملاء</p>
        </div>
      </div>
    </div>

    <!-- Decorative Elements -->
    <div class="absolute -top-4 -left-4 w-8 h-8 bg-primary-500/20 rounded-full blur-xl"></div>
    <div class="absolute -bottom-4 -right-4 w-8 h-8 bg-accent-purple/20 rounded-full blur-xl"></div>
  </div>

  <div id="toast-root" class="toast-root" aria-live="polite"></div>

</body>
</html>
