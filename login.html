<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="manifest" href="manifest.json" />
  <title>تسجيل الدخول - مالاذ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6">
  <div class="card-padded w-full max-w-md">
    <div class="text-center mb-8">
      <div class="text-5xl font-bold text-primary-600 mb-4">MC</div>
      <h1 class="text-2xl font-bold text-slate-50 mb-2">مالاذ كلينينج</h1>
      <p class="text-slate-400">لوحة التحكم</p>
    </div>

    <div id="error-message" class="hidden bg-red-500/20 text-red-300 p-4 rounded-lg mb-6"></div>

    <form id="login-form" class="space-y-6">
      <div>
        <label for="email" class="form-label">البريد الإلكتروني</label>
        <input type="email" id="email" class="form-input" placeholder="ayman@malaz.com" required />
      </div>
      <div>
        <label for="password" class="form-label">كلمة المرور</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" required />
      </div>
      <div class="pt-4">
        <button type="submit" class="btn-primary w-full py-3 text-base font-semibold">
          دخول
        </button>
      </div>
    </form>
  </div>

  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <script type="module" src="js/pages/login.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
