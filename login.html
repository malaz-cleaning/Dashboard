<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="manifest" href="manifest.json" />
  <title>تسجيل الدخول - Malaz Cleaning</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.08);
      border-radius: 22px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
    }
    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-header h1 {
      font-size: 28px;
      margin: 16px 0 8px 0;
    }
    .login-header p {
      color: #94a3b8;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #e2e8f0;
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid rgba(148, 163, 184, 0.08);
      border-radius: 12px;
      background: rgba(148, 163, 184, 0.04);
      color: #e2e8f0;
      font-size: 14px;
    }
    .form-group input:focus {
      outline: none;
      border-color: #3b82f6;
      background: rgba(148, 163, 184, 0.08);
    }
    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 28px;
    }
    .button-group button {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-login {
      background: #3b82f6;
      color: white;
    }
    .btn-login:hover {
      background: #2563eb;
    }
    .btn-login.loading {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .btn-signup.loading {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .btn-signup {
      background: rgba(59, 130, 246, 0.16);
      color: #60a5fa;
    }
    .btn-signup:hover {
      background: rgba(59, 130, 246, 0.24);
    }
    .error-message {
      background: rgba(239, 68, 68, 0.16);
      color: #fca5a5;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      display: none;
    }
    .error-message.show {
      display: block;
    }
    .loading {
      opacity: 0.6;
      pointer-events: none;
    }
    html[data-theme='light'] .login-card {
      background: rgba(255, 255, 255, 0.92);
      color: #0f172a;
    }
    html[data-theme='light'] .form-group label,
    html[data-theme='light'] .login-header h1 {
      color: #0f172a;
    }
    html[data-theme='light'] .form-group input {
      background: rgba(15, 23, 42, 0.04);
      color: #0f172a;
      border-color: rgba(15, 23, 42, 0.08);
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div style="font-size: 48px; font-weight: 700; color: #3b82f6;">MC</div>
        <h1>Malaz Cleaning</h1>
        <p>لوحة التحكم</p>
      </div>
      
      <div id="error-message" class="error-message"></div>
      
      <form id="login-form">
        <div class="form-group">
          <label for="email">البريد الإلكتروني</label>
          <input type="email" id="email" placeholder="ayman@malaz.com" required />
        </div>
        <div class="form-group">
          <label for="password">كلمة المرور</label>
          <input type="password" id="password" placeholder="••••••••" required />
        </div>
        <div class="button-group">
          <button type="submit" class="btn-login">دخول</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <script type="module" src="js/pages/login.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
